service:
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: temporal
    envirornment:
      - SQL_PLUGIN=postgress
      - POSTGRESS_SEEDS=${pg-57eadd1-calendlyapp.l.aivencloud.com}
      - DB_PORT=${25461}
      - POSTGRES_USER=${avnadmin}
      - POSTGRES_PWD=${POSTGRES_PWD:?Set POSTGRES_PWD in .env}
      - DB_NAME=defaultdb
    ports:
      -"7233:7233"



  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      -temporal
    environments:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORGIN: http://localhost:3000,http://localhost:5173
    ports:
      -"8080:8080"

